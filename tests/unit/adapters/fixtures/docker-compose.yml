name: shop
services:
  web:
    image: nginx:1.27
    ports: ["8080:80"]
    depends_on: [api]
    networks: [front]
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://app@db:5432/app
      REDIS_URL: redis://cache:6379
    depends_on: [db, queue]
    networks: [front, back]
  worker:
    image: shop/worker:latest
    environment:
      AMQP_URL: amqp://queue:5672
    networks: [back]
  db:
    image: postgres:17
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [back]
  cache:
    image: redis:7
    networks: [back]
  queue:
    image: rabbitmq:4
    networks: [back]
volumes:
  pgdata: {}
networks:
  front: {}
  back: {}
